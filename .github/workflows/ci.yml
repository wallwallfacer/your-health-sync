name: CI
on:
  push:
    branches: [main]
  pull_request:

# Build and unit tests only. CI-built APKs are signed with the runner's key,
# which is not registered with HUAWEI, so they cannot read HUAWEI data.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK; only add the platform this build needs.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
